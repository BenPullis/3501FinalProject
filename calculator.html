<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Climate Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Merriweather:wght@700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="calc-page">
  <header class="site-header">
    <a class="site-title-btn" href="index.html">Calculate Your Climate Impact</a>
  </header>

  <main class="page-shell calc-layout">
    <section class="card form-card">
      <h1>Carbon Footprint Calculator</h1>
      <p class="subtitle">Enter your habits below, then view your estimated yearly emissions.</p>

      <form id="climate-form" novalidate>
        <div class="grid">

          <div class="input-group">
            <label for="householdSize">Number of People in Household</label>
            <input type="number" id="householdSize" min="1" step="1" />
          </div>
          
          <div class="input-group">
            <label for="milesPerWeek">Transportation: Miles Driven Per Week</label>
            <input type="number" id="milesPerWeek" min="0" step="1" />
          </div>

          <div class="input-group">
            <label for="carType">Transportation: Car Type</label>
            <select id="carType">
              <option value="gas" >Gas</option>
              <option value="hybrid">Hybrid</option>
              <option value="electric">Electric</option>
              <option value="none">None</option>
            </select>
          </div>

          <div class="input-group">
            <label for="flightsPerYear">Flights: One-Way Flights Per Year</label>
            <input type="number" id="flightsPerYear" min="0" step="1"  />
          </div>

          <div class="input-group">
            <label for="flightLength">Flights: Average Flight Length</label>
            <select id="flightLength">
              <option value="short">Short</option>
              <option value="medium" >Medium</option>
              <option value="long">Long</option>
            </select>
          </div>

          <div class="input-group">
            <label for="electricityBill">Home Energy: Monthly Electric Bill (USD)</label>
            <input type="number" id="electricityBill" min="0" step="0.01" />
          </div>

          <div class="input-group">
            <label for="gasBill">Home Energy: Monthly Gas Bill (USD)</label>
            <input type="number" id="gasBill" min="0" step="0.01" />
          </div>

          <div class="input-group">
            <label for="dietType">Food: Diet Type</label>
            <select id="dietType">
              <option value="average" >Average</option>
              <option value="vegan">Vegan</option>
              <option value="vegetarian">Vegetarian</option>
              <option value="high_meat">High Meat</option>
            </select>
          </div>

          <div class="input-group">
            <label for="shoppingFrequency">Consumption: Shopping Frequency</label>
            <select id="shoppingFrequency">
              <option value="very_little">Very Little</option>
              <option value="occasionally" >Occasionally</option>
              <option value="regularly">Regularly</option>
              <option value="frequently">Frequently</option>
            </select>
          </div>

          <div class="input-group">
            <label for="packagesPerMonth">Consumption: Packages/Orders Per Month</label>
            <select id="packagesPerMonth">
              <option value="0_1">0-1</option>
              <option value="2_5" >2-5</option>
              <option value="6_10">6-10</option>
              <option value="11_plus">11+</option>
            </select>
          </div>
        </div>

        <p id="formError" class="error-message" role="alert" aria-live="polite"></p>

        <div class="button-row">
          <button type="submit" class="btn btn-primary">Calculate</button>
          <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>Built by Ben Pullis for ENGL 3501 Final Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
